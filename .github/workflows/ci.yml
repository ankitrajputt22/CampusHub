name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - development
      - feature/contact-support

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test backend
        working-directory: backend
        run: mvn test

      - name: Package backend
        working-directory: backend
        run: mvn package -DskipTests=false

      - name: Build Docker images
        run: |
          docker build -t campushub-backend:${{ github.sha }} ./backend
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8080/api \
            --build-arg VITE_APP_NAME="Campus Hub" \
            --build-arg VITE_PUBLIC_BASE_URL=http://localhost:5173 \
            --build-arg VITE_RAZORPAY_KEY_ID=rzp_test_placeholder \
            -t campushub-frontend:${{ github.sha }} ./frontend
