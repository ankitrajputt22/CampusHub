name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - development

jobs:
  deploy-staging:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_STAGING_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run backend tests
        working-directory: backend
        run: mvn test

      - name: Run frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Build staging Docker images
        run: |
          docker build -t campushub-backend:${{ github.sha }} ./backend
          docker build \
            --build-arg VITE_API_BASE_URL="${{ vars.STAGING_API_BASE_URL }}" \
            --build-arg VITE_APP_NAME="Campus Hub" \
            --build-arg VITE_PUBLIC_BASE_URL="${{ vars.STAGING_PUBLIC_BASE_URL }}" \
            --build-arg VITE_RAZORPAY_KEY_ID="${{ vars.STAGING_RAZORPAY_KEY_ID }}" \
            --build-arg VITE_SUPPORT_EMAIL="${{ vars.STAGING_SUPPORT_EMAIL }}" \
            -t campushub-frontend:${{ github.sha }} ./frontend

      - name: Deployment handoff
        run: |
          echo "Staging deployment is intentionally gated."
          echo "Configure server/registry secrets, then replace this step with SSH or registry deployment."
          echo "Required secrets: STAGING_HOST, STAGING_USER, STAGING_SSH_KEY, STAGING_ENV_FILE, registry credentials."
