spring:
  datasource:
    url: jdbc:h2:file:./data/campushub-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    jwt-secret: ${JWT_SECRET}
  otp:
    expose-dev-codes: true
  demo-data:
    enabled: ${CAMPUSHUB_DEMO_DATA_ENABLED:false}
    password: ${CAMPUSHUB_DEMO_DATA_PASSWORD:}
    college-code: ${CAMPUSHUB_DEMO_DATA_COLLEGE_CODE:RECMAINPURI}
  razorpay:
    mock-enabled: ${RAZORPAY_MOCK_ENABLED:true}
